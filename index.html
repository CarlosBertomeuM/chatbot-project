<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .chat-container {
            max-width: 750px;
            margin: 40px auto;
        }
        #chat {
            height: 450px;
            overflow-y: auto;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .msg-user { text-align: right; margin: 8px 0; }
        .msg-bot { text-align: left; margin: 8px 0; }
        .msg-user .bubble {
            background: #0d6efd;
            color: white;
            padding: 10px 15px;
            border-radius: 18px 18px 4px 18px;
            display: inline-block;
            max-width: 75%;
            text-align: left;
        }
        .msg-bot .bubble {
            background: #e9ecef;
            color: #212529;
            padding: 10px 15px;
            border-radius: 18px 18px 18px 4px;
            display: inline-block;
            max-width: 75%;
        }
        .escribiendo .bubble {
            color: #888;
            font-style: italic;
        }
        .zona-documento {
            border: 2px dashed #0d6efd;
            border-radius: 12px;
            background: white;
            padding: 20px;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="text-center mb-4">
        <h2 class="fw-bold"><i class="bi bi-robot"></i> Chatbot</h2>
        <p class="text-muted">Asistente inteligente con contexto de documentos</p>
    </div>

    <!-- Zona documento -->
    <div class="zona-documento mb-3">
        <div class="row align-items-center g-2">
            <div class="col-12 col-md-auto">
                <label class="form-label fw-semibold mb-0">
                    <i class="bi bi-file-earmark-text"></i> Documento de contexto
                </label>
            </div>
            <div class="col">
                <input type="file" class="form-control" id="archivo" accept=".pdf,.odt,.txt" />
            </div>
            <div class="col-auto">
                <button class="btn btn-primary" onclick="subirDocumento()">
                    <i class="bi bi-upload"></i> Cargar
                </button>
            </div>
        </div>
        <div id="estado-documento" class="mt-2 text-muted small">
            <i class="bi bi-info-circle"></i> Sin documento — modo general
        </div>
    </div>

    <!-- Chat -->
    <div id="chat" class="mb-3"></div>

    <!-- Input -->
    <div class="input-group shadow-sm">
        <input type="text" id="pregunta" class="form-control form-control-lg"
               placeholder="Escribe tu pregunta..." />
        <button class="btn btn-primary" onclick="enviar()">
            <i class="bi bi-send"></i>
        </button>
        <button class="btn btn-danger" onclick="limpiarChat()" title="Limpiar chat">
            <i class="bi bi-trash"></i>
        </button>
    </div>
</div>

<script>
    const historial = [];

    async function subirDocumento() {
        const archivo = document.getElementById("archivo").files[0];
        if (!archivo) {
            alert("Selecciona un archivo primero");
            return;
        }

        const estado = document.getElementById("estado-documento");
        estado.innerHTML = `<i class="bi bi-hourglass-split"></i> Cargando documento...`;

        const formData = new FormData();
        formData.append("archivo", archivo);

        try {
            const respuesta = await fetch("http://127.0.0.1:8000/subir-documento", {
                method: "POST",
                body: formData
            });
            const datos = await respuesta.json();
            estado.innerHTML = `<i class="bi bi-check-circle text-success"></i> ${datos.mensaje}`;
            historial.length = 0;
            document.getElementById("chat").innerHTML = "";
        } catch (e) {
            estado.innerHTML = `<i class="bi bi-x-circle text-danger"></i> Error al cargar el documento`;
        }
    }

    async function enviar() {
        const input = document.getElementById("pregunta");
        const pregunta = input.value.trim();
        if (!pregunta) return;

        agregarMensaje("user", pregunta);
        input.value = "";

        const indicador = agregarIndicador();

        try {
            const respuesta = await fetch("http://127.0.0.1:8000/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ historial, pregunta })
            });

            const datos = await respuesta.json();
            const texto = datos.respuesta;

            historial.push({ role: "user", content: pregunta });
            historial.push({ role: "assistant", content: texto });

            indicador.remove();
            agregarMensaje("bot", texto);
        } catch (e) {
            indicador.remove();
            agregarMensaje("bot", "❌ Error al conectar con el servidor.");
        }
    }

    function agregarMensaje(tipo, texto) {
        const chat = document.getElementById("chat");
        const div = document.createElement("div");
        div.className = tipo === "user" ? "msg-user" : "msg-bot";
        div.innerHTML = `<div class="bubble">${texto}</div>`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    function agregarIndicador() {
        const chat = document.getElementById("chat");
        const div = document.createElement("div");
        div.className = "msg-bot escribiendo";
        div.innerHTML = `<div class="bubble"><i class="bi bi-three-dots"></i> Escribiendo...</div>`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    function limpiarChat() {
        document.getElementById("chat").innerHTML = "";
        historial.length = 0;
    }

    document.getElementById("pregunta").addEventListener("keypress", function(e) {
        if (e.key === "Enter") enviar();
    });
</script>
</body>
</html>
